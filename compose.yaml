services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: water
      POSTGRES_USER: water
      POSTGRES_PASSWORD: water
    volumes:
      - water-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U water -d water"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://water:water@db/water
      REVIEWER_TOKEN: ${REVIEWER_TOKEN:-}
      GNEWS_API_KEY: ${GNEWS_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m app.seed && python -m app.demo && exec uvicorn app.main:app --host 0.0.0.0"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./reports:/reports:ro
  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
volumes:
  water-db:

